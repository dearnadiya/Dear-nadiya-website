<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Dear Nadiya Admin</title>

  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- LOGIN -->
  <div id="login" class="login">

    <div class="loginbox">

      <img src="mascot.png">

      <h1>Dear Nadiya ♥</h1>

      <p>Admin Dashboard</p>

      <input
        id="u"
        type="text"
        placeholder="Username"
        value="admin"
      >

      <input
        id="p"
        type="password"
        placeholder="Password"
        value="180322"
      >

      <button
        id="loginButton"
        type="button"
        onclick="login()"
      >
        Masuk Admin
      </button>

    </div>

  </div>


  <!-- ADMIN DASHBOARD -->
  <div id="app" class="app hidden">

    <aside>

      <div class="brand">

        <img src="mascot.png">

        <b>Dear Nadiya</b>

        <small>ADMIN PANEL</small>

      </div>


      <button
        type="button"
        onclick="page('dash')"
      >
        🏠 Dashboard
      </button>


      <button
        type="button"
        onclick="page('products')"
      >
        📦 Produk & GO
      </button>


      <button
        type="button"
        onclick="page('orders')"
      >
        📝 Pesanan
      </button>


      <button
        type="button"
        onclick="page('payments')"
      >
        💳 Pembayaran
      </button>


      <button
        type="button"
        onclick="page('recap')"
      >
        📈 Rekap GO
      </button>


      <a href="index.html">
        ← Website Customer
      </a>


      <button
        class="logout"
        type="button"
        onclick="logout()"
      >
        Keluar
      </button>

    </aside>


    <main>

      <header>

        <div>

          <small>DEAR NADIYA ADMIN</small>

          <h1 id="title">
            Dashboard
          </h1>

        </div>

      </header>


      <div id="content">

        <p>Memuat dashboard...</p>

      </div>

    </main>

  </div>


  <script src="adminapp.js"></script>

</body>

</html>
