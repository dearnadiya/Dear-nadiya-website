<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Dear Nadiya | Customer Portal</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .portal {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 40px;
    }

    .hero img {
      width: 180px;
      max-width: 35%;
    }

    .eyebrow {
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: bold;
      opacity: .7;
    }

    .search-box {
      margin: 30px 0;
    }

    .search-box input {
      width: 100%;
      box-sizing: border-box;
      padding: 16px 18px;
      border-radius: 14px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    .table-wrap {
      overflow-x: auto;
      background: white;
      border-radius: 18px;
      border: 1px solid #eee;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 950px;
    }

    th,
    td {
      padding: 14px 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
      white-space: nowrap;
    }

    th {
      font-size: 13px;
      background: #fafafa;
    }

    td {
      font-size: 14px;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .loading,
    .empty,
    .error {
      padding: 30px;
      text-align: center;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 25px 0;
    }

    .info-card {
      padding: 22px;
      border-radius: 16px;
      background: white;
      border: 1px solid #eee;
    }

    .info-card h2 {
      margin: 8px 0 0;
    }

    @media (max-width: 700px) {
      .hero {
        flex-direction: column;
        align-items: flex-start;
      }

      .hero img {
        max-width: 150px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>

    <a class="brand" href="#">
      <img src="mascot.png" alt="Dear Nadiya">

      <div>
        <b>Dear Nadiya ♥</b>
        <small>CUSTOMER PORTAL</small>
      </div>
    </a>

    <nav>
      <a href="#dashboard">Dashboard</a>
      <a href="#rekap">Rekap GO</a>
    </nav>

  </header>


  <main class="portal">

    <!-- DASHBOARD -->

    <section class="hero" id="dashboard">

      <div>

        <p class="eyebrow">
          DEAR NADIYA
        </p>

        <h1>
          Customer Portal ♥
        </h1>

        <p>
          Pantau pesanan Group Order kamu melalui rekap
          yang tersedia di sini.
        </p>

      </div>

      <img src="mascot.png" alt="Mascot Dear Nadiya">

    </section>


    <!-- RINGKASAN -->

    <section>

      <div class="info-grid">

        <div class="info-card">
          <p>Total Pesanan</p>
          <h2 id="totalOrder">0</h2>
        </div>

        <div class="info-card">
          <p>Total Produk</p>
          <h2 id="totalProduct">0</h2>
        </div>

        <div class="info-card">
          <p>Data Terakhir</p>
          <h2 id="lastUpdate">-</
